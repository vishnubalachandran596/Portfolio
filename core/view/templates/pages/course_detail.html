{{define "jsonld"}}<script type="application/ld+json">{{.JSONLD}}</script>{{end}}
{{define "content"}}
<section class="section page-hero">
  <div class="container">
    <p class="eyebrow"><a href="/courses">← All courses</a></p>
    <span class="course-level">{{.Course.Level}}</span>
    <h1>{{.Course.Title}}</h1>
    <p class="hero-subtitle">{{.Course.Summary}}</p>
    <div class="course-detail-meta">
      <span>{{.Course.PriceDisplay}}</span>
      {{if .Course.Duration}}<span>· {{.Course.Duration}}</span>{{end}}
    </div>
    <div class="hero-actions">
      <a class="btn btn-primary" href="/booking">Book Time to Discuss</a>
    </div>
  </div>
</section>

<section class="section">
  <div class="container course-description">
    {{range $p := splitLines .Course.Description}}<p>{{$p}}</p>{{end}}
  </div>
</section>
{{end}}
