{{define "content"}}
<section class="page-hero page-hero-narrow">
  <div class="container">
    <p class="eyebrow">Account</p>
    <h1>Choose a new password</h1>
    <p class="hero-subtitle">For {{.Email}}. Saving signs you out everywhere else.</p>
  </div>
</section>

<section class="section">
  <div class="container auth-container"><div class="auth-card">
    {{if .Error}}<div class="alert alert-error" role="alert">{{.Error}}</div>{{end}}
    <form method="POST" action="/forgot/reset" class="auth-form">
      <input type="hidden" name="token" value="{{.Token}}">
      <label>New password <span class="field-help">At least 10 characters.</span>
        <span class="password-field">
          <input type="password" name="password" id="reset-password" autocomplete="new-password" minlength="10" maxlength="72" required autofocus>
          <button type="button" class="password-toggle" data-target="reset-password" aria-label="Show password">Show</button>
        </span>
      </label>
      <label>Confirm new password
        <input type="password" name="confirm" autocomplete="new-password" minlength="10" maxlength="72" required>
      </label>
      <button type="submit" class="btn btn-primary" data-loading-text="Saving…">Save new password</button>
    </form>
  </div></div>
</section>
{{end}}
