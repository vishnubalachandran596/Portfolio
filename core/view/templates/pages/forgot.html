{{define "content"}}
<section class="page-hero page-hero-narrow">
  <div class="container">
    <p class="eyebrow">Account</p>
    <h1>Reset your password</h1>
    <p class="hero-subtitle">Enter your email and we will send you a link to choose a new password.</p>
  </div>
</section>

<section class="section">
  <div class="container auth-container"><div class="auth-card">
    {{if .Error}}<div class="alert alert-error" role="alert">{{.Error}}</div>{{end}}
    <form method="POST" action="/forgot" class="auth-form">
      <div hidden aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <label>Email
        <input type="email" name="email" value="{{.Email}}" autocomplete="username" required autofocus>
      </label>
      {{if .TurnstileSiteKey}}<div class="cf-turnstile" data-sitekey="{{.TurnstileSiteKey}}" data-appearance="interaction-only"></div>
      <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{{end}}
      <button type="submit" class="btn btn-primary" data-loading-text="Sending…">Email me a reset link</button>
    </form>
    <p class="auth-fineprint">If you log in with Google, use Google instead: there is no password to reset. <a href="/login">Back to log in</a></p>
  </div></div>
</section>
{{end}}
