{{define "content"}}
<section class="section">
  <div class="container">
    <h1>{{if .IsNew}}Add Software{{else}}Edit Software{{end}}</h1>
    {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
    <form method="POST" action="{{if .IsNew}}/admin/software/new{{else}}/admin/software/{{.Software.ID}}/edit{{end}}" class="admin-form">
      <div class="form-row">
        <label>Title
          <input type="text" name="title" value="{{.Software.Title}}" required placeholder="e.g. Temple Accounts &amp; Billing">
        </label>
        <label>Version
          <input type="text" name="version" value="{{.Software.Version}}" placeholder="e.g. 1.0.0">
        </label>
      </div>
      <label>URL slug <span class="optional">leave blank to generate from the title</span>
        <input type="text" name="slug" value="{{.Software.Slug}}" placeholder="e.g. temple-accounts-billing">
      </label>
      <label>Summary <span class="optional">one line — shown on the catalog card and the product page's hero; supports **bold** and *italic*</span>
        <input type="text" name="summary" value="{{.Software.Summary}}" placeholder="e.g. A local order and expense tracker for temples, no subscription.">
      </label>
      <label>Description <span class="optional">full write-up — supports **bold** and *italic*; shown in full on the product page, and inline behind "Read more" on the catalog card</span>
        <textarea name="description" rows="4">{{.Software.Description}}</textarea>
      </label>

      <label>Licence product id <span class="optional">the "prod" value signed into keys, e.g. temple-accounts. Leave empty if this item has no licence keys.</span>
        <input type="text" name="licence_product" value="{{.Software.LicenceProduct}}" placeholder="temple-accounts" pattern="[a-z0-9-]*">
      </label>
      <label>Licence app versions <span class="optional">comma-separated app major versions offered in the My licences dropdown, e.g. 1</span>
        <input type="text" name="licence_versions" value="{{if .Software.LicenceVersions}}{{.Software.LicenceVersions}}{{else}}1{{end}}" placeholder="1">
      </label>

      <hr class="admin-form-divider">
      <h2 class="admin-form-subhead">Pricing & delivery</h2>
      <div class="form-row">
        <label>Price, INR <span class="optional">0 = free</span>
          <input type="number" name="price" value="{{.Software.PriceWhole}}" min="0" step="1">
        </label>
      </div>
      <label>Download link <span class="optional">external URL (e.g. a Google Drive folder) — revealed only after a verified purchase, or to you as admin</span>
        <input type="url" name="download_link" value="{{.Software.DownloadLink}}" placeholder="https://drive.google.com/drive/folders/...">
      </label>
      <label>License terms <span class="optional">shown on the product page and the purchase receipt, e.g. "Licensed per device"</span>
        <input type="text" name="license_terms" value="{{.Software.LicenseTerms}}" placeholder="e.g. Licensed per device">
      </label>
      <label>Post-purchase instructions <span class="optional">shown on the product page and the purchase receipt, e.g. how to get a license key</span>
        <textarea name="post_purchase_instructions" rows="2" placeholder="e.g. Email support@yourdomain.com with your receipt to receive your license key.">{{.Software.PostPurchaseInstructions}}</textarea>
      </label>

      <hr class="admin-form-divider">
      <h2 class="admin-form-subhead">AI chatbot context</h2>
      <label>RAG context <span class="optional">(optional — a self-contained paragraph for the AI chatbot to quote when answering about this software. Leave blank to fall back to the description above. Takes effect after the next "Rebuild Index" on /admin/chatbot.)</span>
        <textarea name="rag_context" rows="4">{{.Software.RagContext}}</textarea>
      </label>

      <hr class="admin-form-divider">
      <label class="checkbox-label">
        <input type="checkbox" name="is_published" {{if .Software.IsPublished}}checked{{end}}>
        Published (visible in the public Software catalog)
      </label>
      <label>Sort order
        <input type="number" name="sort_order" value="{{.Software.SortOrder}}">
      </label>

      <hr class="admin-form-divider">
      <h2 class="admin-form-subhead">SEO</h2>
      {{template "admin_seo_fields" .SEO}}

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" data-loading-text="Saving…">Save Software</button>
        <a class="btn btn-secondary" href="/admin/software">Cancel</a>
      </div>
    </form>
  </div>
</section>
{{end}}
