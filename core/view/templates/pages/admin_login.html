{{define "content"}}
<section class="section auth-section">
  <div class="container auth-container">
    <h1>Admin Login</h1>
    {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
    <form method="POST" action="/admin/login" class="auth-form">
      <label>Email
        <input type="email" name="email" required autofocus>
      </label>
      <label>Password
        <span class="password-field">
          <input type="password" name="password" id="admin-password" required>
          <button type="button" class="password-toggle" data-target="admin-password" aria-label="Show password">Show</button>
        </span>
      </label>
      <button type="submit" class="btn btn-primary" data-loading-text="Logging in…">Log in</button>
    </form>
  </div>
</section>
{{end}}
