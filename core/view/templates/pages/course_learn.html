{{define "content"}}
<div class="lesson-shell">
  <div class="lesson-toolbar">
    <div class="container lesson-toolbar-inner">
      <p class="eyebrow"><a href="/courses/{{.Course.Slug}}">← {{.Course.Title}}</a></p>
      {{if .HasQuiz}}<a class="btn btn-secondary btn-sm" href="/courses/{{.Course.Slug}}/quiz">Take the Final Quiz</a>{{end}}
    </div>
  </div>
  <div class="html-renderer lesson-renderer" id="html-renderer">
    <div class="html-content article-body" id="html-root"></div>
  </div>
</div>
{{.Watermark}}

<script>
(function () {
  var b = "{{.LessonPayload}}";
  var bin = atob(b);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var html = new TextDecoder("utf-8").decode(bytes);
  var root = document.getElementById("html-root");
  if (!root) return;
  root.innerHTML = html;
  var scripts = root.querySelectorAll("script");
  for (var i = 0; i < scripts.length; i++) {
    var old = scripts[i];
    var s = document.createElement("script");
    if (old.src) s.src = old.src;
    else s.textContent = old.textContent;
    old.parentNode.replaceChild(s, old);
  }
  root.addEventListener("click", function (e) {
    var a = e.target.closest("a[href^='#']");
    if (!a) return;
    var id = (a.getAttribute("href") || "").slice(1);
    if (!id) return;
    var el = root.querySelector("#" + (window.CSS && CSS.escape ? CSS.escape(id) : id));
    if (!el) return;
    e.preventDefault();
    el.scrollIntoView({ block: "start" });
  });
})();
</script>
{{end}}
