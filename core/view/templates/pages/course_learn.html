{{define "content"}}
<div class="lesson-shell">
  <div class="lesson-toolbar">
    <div class="container lesson-toolbar-inner">
      <p class="eyebrow"><a href="/courses/{{.Course.Slug}}">← {{.Course.Title}}</a></p>
      {{if .HasQuiz}}<a class="btn btn-secondary btn-sm" href="/courses/{{.Course.Slug}}/quiz">Take the Final Quiz</a>{{end}}
    </div>
  </div>
  <div class="html-renderer lesson-renderer" id="html-renderer">
    <iframe id="lesson-frame" class="lesson-frame" title="{{.Course.Title}}" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
  </div>
</div>

<script>
(function () {
  var b = "{{.LessonPayload}}";
  var bin = atob(b);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var html = new TextDecoder("utf-8").decode(bytes);
  var frame = document.getElementById("lesson-frame");
  if (!frame) return;
  function syncTheme() {
    try {
      frame.contentWindow.postMessage({
        type: "site-theme",
        theme: document.documentElement.getAttribute("data-theme") || ""
      }, "*");
    } catch (err) {}
  }
  frame.addEventListener("load", syncTheme);
  new MutationObserver(syncTheme).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["data-theme"]
  });
  frame.srcdoc = html;
})();
</script>
{{end}}
