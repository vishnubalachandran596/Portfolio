{{define "header"}}
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{.Nav.Home}}">{{.SiteName}}</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-nav">
      <span></span><span></span><span></span>
    </button>
    <nav class="primary-nav" id="primary-nav">
      <a href="{{.Nav.Home}}" class="{{if eq .Active "home"}}active{{end}}">Home</a>
      <a href="{{.Nav.About}}" class="{{if eq .Active "about"}}active{{end}}">About</a>
      <a href="{{.Nav.Courses}}" class="{{if eq .Active "courses"}}active{{end}}">Courses</a>
      <a href="{{.Nav.Search}}" class="{{if eq .Active "search"}}active{{end}}" aria-label="Search">Search</a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark or light theme">
        <span class="theme-toggle-icon" aria-hidden="true">◐</span>
      </button>
      <a href="{{.Nav.Booking}}" class="{{if eq .Active "booking"}}active{{end}} cta-link">Book Time</a>
    </nav>
  </div>
</header>
{{end}}
